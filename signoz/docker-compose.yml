# Lightweight OTLP endpoint for verifying SYNAPSE telemetry export locally.
# `docker compose -f signoz/docker-compose.yml up` then run SYNAPSE with
# SYNAPSE_OTEL_ENABLED=1 and OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
# Received spans/metrics are printed to the collector's stdout.
#
# For a full SigNoz UI (dashboards, trace explorer), see signoz/README.md — this
# collector can forward to SigNoz by adding an otlp exporter.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: synapse-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
